name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Validates every published dataset against the adapters that read it.
      # No browser, so a malformed file fails here in seconds rather than as an
      # empty panel further down.
      - run: npm run test:data

      - run: npm run build

      # Playwright is deliberately not a project dependency — the smoke test is
      # the only thing that needs a browser, so CI installs it on the fly.
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve the build
        run: |
          npm run preview -- --port 4321 --strictPort &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4321/ && exit 0
            sleep 1
          done
          echo "preview server did not come up" >&2
          exit 1

      - name: Smoke test
        run: npm run smoke
        env:
          SMOKE_URL: http://localhost:4321

      # The suite above runs with nothing published, so it only covers the seed
      # fallback. This one stages a dataset and asserts the Atlas reads it.
      - name: Smoke test — published data path
        run: npm run smoke:published
        env:
          SMOKE_URL: http://localhost:4321
